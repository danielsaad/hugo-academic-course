<!DOCTYPE html>
<html lang="{{ site.Language.Locale}}">
<head>
    {{ partial "head.html" . }}
</head>

<body>
    {{ partial "header.html" . }}
    <div class="site-layout">

        <aside class="sidebar">
            {{ partial "menu.html" (dict "page" . "menuID" "main") }}
        </aside>

        <div class="site-content">
            {{ block "main" . }}{{ end }}
        </div>

    </div>
    {{ partial "footer.html" . }}
</body>
</html>
